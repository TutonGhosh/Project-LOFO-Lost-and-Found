<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOFO</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="assets/lofo-logo.png?v=1" type="image/png">
    <!-- DaisyUI & TailwindCSS CDS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/61951a945a.js" crossorigin="anonymous"></script>

</head>
<body class="font-outfit bg-[#f4f5f7] h-[100vh] py-5 px-2">
    <!-- Home Section -->
    <section class="max-w-[1280px] mx-auto">
        <!-- Navbar -->
        <div class="navbar bg-base-100 shadow-sm rounded-lg">
            <div class="navbar-start">
                <i onclick="profile()" class="fa-regular fa-circle-user text-3xl p-1 bg-gradient-to-r from-cyan-500 to-blue-500 text-white rounded-full"></i>
            </div>
            <div class="navbar-end">
                <button id="btn-sign-out" onclick="createPostFromHome()" class="btn shadow-none border-none text-white text-lg bg-gradient-to-r from-cyan-500 to-blue-500">Create Post</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
