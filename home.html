<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOFO</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="assets/lofo-logo.png?v=1" type="image/png">
    <!-- DaisyUI & TailwindCSS CDS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/61951a945a.js" crossorigin="anonymous"></script>

</head>
<body class="font-outfit bg-[#f4f5f7] h-[100vh] py-5 px-2">
    <!-- Home Section -->
    <section class="max-w-[1280px] mx-auto">
        <!-- Navbar -->
        <div class="navbar bg-base-100 shadow-sm rounded-lg w-full md:w-3/5 md:mx-auto">
            <div class="navbar-start">
                <i onclick="profile()" class="fa-regular fa-circle-user text-3xl p-1 bg-gradient-to-r from-cyan-500 to-blue-500 text-white rounded-full align-middle"></i>
            </div>
            <div class="navbar-end">
                <button id="btn-sign-out" onclick="createPostFromHome()" class="btn shadow-none border-none text-white text-lg bg-gradient-to-r from-cyan-500 to-blue-500">Create Post</button>
            </div>
        </div>
        <!-- All Posts -->
         <div class="mt-10 w-full md:w-3/5 md:mx-auto">
            <div class="px-2.5 mb-5 flex items-center justify-between">
                <h1 class="text-xl font-bold text-gray-600">All Posts</h1>
                <!-- <button onclick="deleteAllPosts()" class="btn text-white text-lg bg-gradient-to-r from-cyan-500 to-blue-500">Delete All Posts</button> -->
            </div>
            <div id="all-posts" class="space-y-10">
                <!-- <div class="bg-[#f4f5f7] w-[calc(100%-20px)] mx-auto h-auto p-5 flex items-start justify-between gap-2 rounded-lg">
                    <div>
                        <h1 class="text-3xl font-bold">Title</h1>
                        <p class="text-sm text-gray-500">Post creator name | Date, Time</p>
                        <p class="text-sm text-gray-500">📍Location</p>
                        <div class="">
                            <h1>Paragraph: Lorem ipsum dolor sit amet consectetur adipisicing elit. Asperiores error molestiae sed
                                nam tenetur, totam ipsa eum doloribus fugit tempora!</h1>
                        </div>
                    </div>
                    <div class="">
                        <button id=""
                            class="btn shadow-none border-none text-green-600 text-lg bg-green-200 rounded-full">Found</button>
                    </div>
                </div> -->
            </div>
        </div>
    </section>

    <script>
        const allPosts = document.getElementById('all-posts');
        if (allPosts) {
            const posts = JSON.parse(localStorage.getItem('posts') || '[]');
            posts.forEach(post => {
                const div = document.createElement('div');
                const isLost = post.inputOpt === 'lost';

                div.innerHTML = `
            <div class="bg-[#FFFFFF] w-full h-auto p-5 flex items-start justify-between gap-2 rounded-lg">
                <div>
                    <h1 class="text-3xl font-bold">${post.inputTitle}</h1>
                    <p class="text-sm text-gray-500">${localStorage.getItem('p-name')} | ${post.time}</p>
                    <p class="text-sm text-gray-500">📍${post.inputLocation}</p>
                    <h1>${post.inputParagraph}</h1>
                </div>
                <div>
                    <button class="btn shadow-none border-none ${isLost ? 'text-red-600 bg-red-200' : 'text-green-600 bg-green-200'} text-lg rounded-full">
                        ${post.inputOpt}
                    </button>
                </div>
            </div>`;

                allPosts.appendChild(div);
            });
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
