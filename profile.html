<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOFO</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="assets/lofo-logo.png?v=1" type="image/png">
    <!-- DaisyUI & TailwindCSS CDS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/61951a945a.js" crossorigin="anonymous"></script>

</head>
<body class="font-outfit bg-[#f4f5f7] min-h-[100vh] py-5 px-2 flex items-center justify-center">
    <!-- Profile Section -->
    <section class="w-[330px] md:min-w-[500px] bg-[#FFFFFF] rounded-xl py-10">
        <div class="flex flex-col items-center space-y-5 p-5">
            <!-- Icon -->
            <div>
                <i onclick="profile()" class="fa-regular fa-circle-user text-9xl p-1 bg-gradient-to-r from-cyan-500 to-blue-500 text-white rounded-full"></i>
            </div>
            <!-- Name -->
            <div class="flex flex-col items-center justify-center">
                <h1 id="profile-name" class="text-xl text-gray-500">First Name Last Name</h1>
                <p id="username" class="text-base text-gray-400">@Username</p>
            </div>
            <!-- Button -->
            <div class="w-full flex flex-col justify-between items-center gap-2 px-5">
                <button id="btn-sign-in" onclick="createPostFromProfile()" class="btn w-3/4 text-white text-lg bg-gradient-to-r from-cyan-500 to-blue-500">Create Post</button>
                <button id="btn-sign-in" onclick="backToHome()" class="btn w-3/4 text-white text-lg bg-gradient-to-r from-cyan-500 to-blue-500">Back to Home</button>
                <button id="btn-sign-up" onclick="signOut()" class="btn w-3/4 text-white text-lg bg-gradient-to-r from-cyan-500 to-blue-500">Sign Out</button>
            </div>
        </div>
        <!-- All Posts -->
        <div class="mt-10">
            <div class="px-2.5 mb-5 flex items-center justify-between">
                <h1 class="text-xl font-bold text-gray-600">All Posts</h1>
                <button onclick="deleteAllPosts()" class="btn text-white text-lg bg-gradient-to-r from-cyan-500 to-blue-500">Delete All Posts</button>
            </div>
            <div id="all-posts" class="space-y-10">
                <div id="not-any-post-created" class="bg-[#f4f5f7] w-[calc(100%-20px)] mx-auto h-auto p-5 flex items-start justify-center gap-2 rounded-lg">
                    <div>
                        <h1 class="text-2xl font-bold">Not Any Post Created.</h1>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('not-any-post-created').classList.add('hidden');

        // Profile Name & Username
        // Name
        const profileName = document.getElementById('profile-name');
        if (profileName) {
            profileName.textContent = localStorage.getItem('p-name');
        }
        // Username
        let inputName = localStorage.getItem('p-name');
        if (inputName) {
            const userName = '@' + inputName.replace(/\s+/g, '').toLowerCase();
            const usernameEl = document.getElementById('username');
            if (usernameEl) {
                usernameEl.textContent = userName;
            }
        }

        const allPosts = document.getElementById('all-posts');
        if (allPosts) {
            const posts = JSON.parse(localStorage.getItem('posts') || '[]');
            posts.forEach(post => {
                const div = document.createElement('div');
                const isLost = post.inputOpt === 'lost';

                div.innerHTML = `
            <div class="bg-[#f4f5f7] w-[calc(100%-20px)] mx-auto h-auto p-5 flex items-start justify-between gap-2 rounded-lg">
                <div>
                    <h1 class="text-3xl font-bold">${post.inputTitle}</h1>
                    <p class="text-sm text-gray-500">${localStorage.getItem('p-name')} | ${post.time}</p>
                    <p class="text-sm text-gray-500">📍${post.inputLocation}</p>
                    <h1>${post.inputParagraph}</h1>
                </div>
                <div>
                    <button class="btn shadow-none border-none ${isLost ? 'text-red-600 bg-red-200' : 'text-green-600 bg-green-200'} text-lg rounded-full">
                        ${post.inputOpt}
                    </button>
                </div>
            </div>`;

                allPosts.appendChild(div);
            });
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
