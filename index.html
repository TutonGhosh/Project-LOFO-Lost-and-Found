<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOFO</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="assets/lofo-logo.png?v=1" type="image/png">
    <!-- DaisyUI & TailwindCSS CDS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/61951a945a.js" crossorigin="anonymous"></script>

</head>
<body class="font-outfit bg-[#f4f5f7] h-[100vh] flex justify-center items-center">
    <!-- Login Section -->
    <section id="login-section" class="flex flex-col items-center bg-[#FFFFFF] rounded-xl min-w-[300px] py-10">
        <div class="my-5 h-20 w-20 flex items-center justify-center bg-gradient-to-r from-cyan-500 to-blue-500 rounded-xl">
            <h1 class="text-white text-2xl font-bold"><span>L</span> <span>O</span> <br> <span>F</span> <span>O</span></h1>
        </div>
        <div class="w-full flex flex-col justify-between items-center gap-2 px-5">
            <button id="btn-sign-in" onclick="signIn()" class="btn w-1/2 text-black text-lg hover:bg-gradient-to-r from-cyan-500 to-blue-500 hover:text-white">Sign In</button>
            <button id="btn-sign-up" onclick="signUp()" class="btn w-1/2 text-black text-lg hover:bg-gradient-to-r from-cyan-500 to-blue-500 hover:text-white">Sign Up</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
